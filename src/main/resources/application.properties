spring.application.name=wexp
spring.config.import=optional:file:.env[.properties]

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=86400000

steam.api.base-url=https://api.steampowered.com
steam.store.base-url=https://store.steampowered.com
steam.images.base-url=https://cdn.akamai.steamstatic.com/steam/apps
steam.capsule-image-base-url=https://shared.akamai.steamstatic.com/store_item_assets/steam/apps
steam.api.key=${STEAM_API_KEY}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

images.storage.location=uploads/images
images.max-size-bytes=10485760
