spring.application.name=wexp
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${PORT:8080}
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=86400000

steam.api.base-url=https://api.steampowered.com
steam.store.base-url=https://store.steampowered.com
steam.images.base-url=https://cdn.akamai.steamstatic.com/steam/apps
steam.capsule-image-base-url=https://shared.akamai.steamstatic.com/store_item_assets/steam/apps
steam.api.key=${STEAM_API_KEY}

steam.client.connect-timeout=3s
steam.client.read-timeout=10s
steam.client.circuit-failure-threshold=5
steam.client.circuit-open-duration=30s
steam.client.refresh-interval=7d
steam.client.refresh-max-attempts=2
steam.client.refresh-retry-delay=250ms

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
server.forward-headers-strategy=framework

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=${DB_BATCH_SIZE:500}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

images.storage.location=uploads/images
images.max-size-bytes=10485760
